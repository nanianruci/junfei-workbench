<body class="auth-pending"><style>body.auth-pending .app,body.auth-pending #modal{display:none}</style><div class="app"><aside><a class="brand" href="/" aria-label="钧飞跨境 · 返回主页" title="返回工作台" onclick="workbenchLink(event,'home')" style="text-decoration:none;color:inherit"><img src="assets/junfei-logo.png" alt="钧飞跨境" style="width:100%;height:auto;display:block"><small>商品内容工作台</small></a><button id="workbenchNavToggle" type="button" class="ds-button" aria-controls="nav" aria-expanded="false">导航</button><nav id="nav" aria-label="工作台导航"></nav><div class="sidefoot">Amazon AI Product Studio</div></aside><main><header><div class="crumb">团队工作空间 <span style="margin:0 12px">/</span><span id="crumb"></span></div><div class="user"><span class="badge">US / UK</span><span class="avatar">林</span><span>林主管</span></div></header><div class="content" id="content"></div></main></div><dialog id="modal"></dialog><div id="toast" class="toast" hidden></div>
<script>
let state;try{state=JSON.parse(localStorage.getItem('listing-studio-v1'))}catch{};if(!state||!Array.isArray(state.products))state={products:[],copy:{},reviews:{}};state.copy ||= {};state.reviews ||= {};
let view='home',filter='全部',query='',selected=state.products[0]?.id||'',market='US',imageIndex=0;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem('listing-studio-v1',JSON.stringify(state))}catch{toast('浏览器存储不可用，本次修改仍保留在当前页面')}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').hidden=true,3200)}
function product(){return state.products.find(p=>p.id===selected)||state.products[0]}
function art(p){return p.cat==='服装'?`<svg viewBox="0 0 160 160" aria-label="服装示意图"><path d="M53 25 25 39 9 72 35 86 46 66 43 140 117 140 114 66 125 86 151 72 135 39 107 25Q80 45 53 25" fill="${p.color}"/><path d="M62 28Q80 51 98 28" fill="none" stroke="#ffffff88" stroke-width="5"/><path d="M48 135h65" stroke="#0001" stroke-width="3"/></svg>`:`<svg viewBox="0 0 160 160" aria-label="收纳用品示意图"><path d="m25 48 80-15 37 25-78 18Z" fill="#e3d7c2"/><path d="m25 48 39 28 78-18-9 64-70 18-30-26Z" fill="${p.color}"/><path d="m64 76-1 64M32 69l29 20 72-17M34 85l27 20 70-17M37 102l24 19 67-17" stroke="#ffffff50" fill="none" stroke-width="3"/></svg>`}
const names={home:'工作台',library:'产品档案',products:'产品档案',reviews:'质检中心',agent:'任务中心',skills:'技能',settings:'模型设置',guide:'使用教程',listing:'Listing 编辑',images:'图片工作台'};
const workspaceRoutes={home:'/',library:'/library',products:'/products',reviews:'/quality',agent:'/tasks',skills:'/skills',settings:'/settings',guide:'/help'};
function restoreWorkspaceRoute(){
 const route=new URLSearchParams(location.search), id=route.get('product'), step=route.get('step');
 if(id){
  if(!state.products.some(p=>p.id===id)){view='products';return}
  selected=id;listingWorkspaceProduct=id;listingWorkspaceStep=isListingStep(step)?step:'product';
  view=listingWorkspaceStep==='visual'?'images':'listing';
 }else{view=Object.keys(workspaceRoutes).find(key=>workspaceRoutes[key]===location.pathname)||'home';if(['library','reviews'].includes(view)){view='products';history.replaceState(null,'','/products'+location.search);}}
}
function go(v){
 if(['library','reviews'].includes(v))v='products';
 const route=workspaceRoutes[v] || ('/?'+new URLSearchParams({product:listingWorkspaceProduct||selected,step:listingWorkspaceStep}));
 if(/^https?:$/.test(location.protocol)&&route!==location.pathname+location.search)history.pushState(null,'',route);
 view=v;render();window.scrollTo({top:0,behavior:'instant'});
}
const listingSteps={product:'关键词与评论分析',copy:'Listing 文案',visual:'视觉套图',delivery:'交付'};
let listingWorkspaceStep='product',listingWorkspaceProduct='';
function isListingStep(step){return Object.hasOwn(listingSteps,step)}
function openListingWorkspace(id,step='product'){
 if(!state.products.some(p=>p.id===id))return go('products');
 selected=id;listingWorkspaceProduct=id;listingWorkspaceStep=step;
 go(step==='visual'?'images':'listing');
}
function openProduct(id,v){
 if(v==='listing'||v==='images')return openListingWorkspace(id,v==='images'?'visual':'product');
 selected=id;go(v);
}
function title(t,p,buttons=''){return `<div class="titlebar"><div class="wb-title-label"><h1>${t}</h1>${p?workbenchHelp(p,t):""}</div>${buttons?`<div class="actions">${buttons}</div>`:""}</div>`}
function picker(){return `<select id="productPicker" aria-label="当前产品">${state.products.map(p=>`<option value="${esc(p.id)}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`}
function renderGuide(){document.getElementById('content').innerHTML=title('使用教程','从账号配置开始，在产品工作台依次完成资料、文案、作图和交付。')+'<div class="actions"><button class="btn primary" id="guideProducts">去产品档案</button><button class="btn" id="guideSettings">去配置模型</button></div><details class="panel guide-section" open><summary>第一次使用：账号和配置</summary><div><ol><li>打开团队提供的工作台地址，在登录页点击“注册员工账号”，填写账号信息。</li><li>注册后等待管理员批准，再登录。管理员在“账号与插件”中管理员工账号。</li><li>进入“模型设置”，分别打开“文案模型”和“图片模型”，配置本账号使用的服务。对应页面提供配置说明和连接测试。</li><li>卖家精灵 MCP 由管理员统一保存，员工直接使用，共用平台额度；产品、文案、图片与其他模型配置按账号独立。</li></ol></div></details><details class="panel guide-section"><summary>1 · 导入产品：货源资料和竞品分开用</summary><div><ol><li>从“产品档案”点击“ASIN / 货源导入”，选择正确站点，填写货源链接或 ASIN。</li><li>1688 货源用于材质、采购价、产品尺寸、包装尺寸、重量、颜色尺码及真实图片；竞品 ASIN 用于关键词、流量词和买家评论。</li><li>自动读取遇到登录或验证码时，在安装采集插件的 Chrome / Edge 打开货源页，自己完成验证，再用插件采集。插件需配置云端地址并登录自己的员工账号，“账号与插件”提供接入入口。</li><li>采集后在产品档案找到产品，点击“编辑产品”。核对实际款式和关键规格；包装尺寸不能当作衣服尺寸。缺失事实需补充，不要用竞品属性代替。</li></ol></div></details><details class="panel guide-section"><summary>2 · 素材与洞察：先分析关键词和评论</summary><div><ol><li>进入产品的“素材与洞察”，填写同款或接近款的竞品 ASIN，最多 5 个，并确认来源站点。</li><li>点击“一键获取关键词和评论”，等待数据获取和分析结束。若部分失败，查看提示并单独重试失败部分。</li><li>检查关键词的月搜索量、购买量、购买率、流量占比及来源。可以按指标排序，查看 AI 已选词和未选词，手动调整。</li><li>优先关注真实月搜索量 500–8,000 的相关词，同组参考购买率；不能把缺失数据当作 0，也不能把关键词市场购买率当作自己产品的转化率。</li><li>阅读评论洞察，确认买家痛点与本产品事实是否一致，再进入文案步骤。</li></ol></div></details><details class="panel guide-section"><summary>3 · Listing 文案：生成、对比、采用</summary><div><ol><li>进入“② Listing 文案”，站点跟随产品，先确认货源资料、关键词和评论分析已准备好。</li><li>点击生成文案，确认调用后等待进度提示。不要重复点击，以免重复消耗额度。</li><li>新草稿生成后先对比，再采用；如果提示有新草稿待采用，请先处理，不能只看旧文案。</li><li>分别检查主标题、商品亮点、五个独立的五点框、产品描述和后台搜索词；中英文并排便于核对。关键词标记的含义见文案区的「？」。</li><li>核对材质、尺寸、数量、适用人群，删掉不真实或不允许的宣称。字符计数是软件草稿检查，刊登前仍需核对类目要求。</li><li>如需调整生成要求，到“模型设置”的 Listing 生成提示词编辑并保存，下次生成生效；不会自动改写已有文案。</li></ol></div></details><details class="panel guide-section"><summary>4 · 视觉套图：先做一套母版</summary><div><ol><li>进入“③ 商品作图”，先在真实素材中选主体图；可以选择已采集的产品图，也可补充清晰实拍图。</li><li>主体图应清楚展示真实版型、商标位置、图案和面料。先确认母版颜色，再规划白底、场景、细节等图片用途。</li><li>选择已适配的图片模型，查看并调整图片方案后，先生成一张检查效果，满意后再生成剩余图片。</li><li>逐张检查商标是否跑到皮肤上、服装结构是否改变、纽扣口袋是否增减、颜色是否偏差，以及尺寸文字是否真实。错误图片需修改方案或更换参考图后重做。</li><li>生成成功不等于通过审核，确认每张可用后再交付。真实产品一致性优先于画面好看。</li></ol></div></details><details class="panel guide-section"><summary>5 · 变体换色：复用母版构图</summary><div><ol><li>先完成并确认一套母版，在“颜色变体”中核对母版颜色及图片。</li><li>选择目标颜色，填写准确颜色名称，尽可能提供对应颜色的真实参考图，然后发起换色。</li><li>保留服装版型、图案、商标、模特和背景，只改变目标产品的颜色；生成后仍要逐张检查。</li><li>每个颜色生成完成后核对结果。失败或没有图片的版本不会成为可交付图片，需重试后再导出。</li></ol></div></details><details class="panel guide-section"><summary>6 · 自动交付：文案和所有颜色图片</summary><div><ol><li>进入“④ 交付”，确认采用的是最终文案，母版和换色图片均已完成。</li><li>文案和图片由自动流程检查，完成后通过交付页交接 ERP。</li><li>如需备份，点击“下载可选备份 ZIP”。解压后可查看本次交付使用的文案和图片。</li><li>SKU 使用员工姓名拼音缩写加日期时间，中间不加横杠。交付 Listing 文本末尾带货源网址，标注为内部资料，不要复制到亚马逊买家可见文案。</li><li>图片包含已保存的母版与变体换色结果。颜色明确时按颜色＋编号命名；颜色不明确时使用 A1、A2、A3。</li><li>修改后重新导出，旧压缩包不会自动更新。本软件导出文件不等于已发布到亚马逊。</li></ol></div></details><details class="panel guide-section"><summary>常见问题：没有数据、生成失败、下载缺图</summary><div><dl><dt><strong>关键词或评论获取失败</strong></dt><dd>核对站点、ASIN 和共用 MCP 状态。让管理员检查卖家精灵权限及额度；平台没有返回的指标显示为空，不要自行补造。</dd><dt><strong>生成文案或图片失败</strong></dt><dd>先看具体错误，再检查自己的模型密钥、余额、模型权限。测试密钥成功仅说明对应测试通过，不保证所有生成模型都可用。</dd><dt><strong>采集不到 1688</strong></dt><dd>核对插件服务器地址为云端 HTTPS 地址，退出插件后重新登录自己的员工账号；完成网站验证后再采集，确认回到产品档案能找到记录。</dd><dt><strong>导出少图片或少颜色</strong></dt><dd>确认对应图片确实生成成功并已保存在当前产品；再检查变体换色结果，完成后重新下载交付 ZIP。</dd><dt><strong>保存冲突或账号已变化</strong></dt><dd>按提示备份未保存内容后刷新，不要在多个页面同时修改同一产品。切换账号后刷新页面。</dd><dt><strong>本机和云端内容不同</strong></dt><dd>统一使用云端地址；本机服务与云端是独立数据副本，不会自动同步。</dd></dl></div></details>';document.getElementById('guideProducts').onclick=()=>go('products');document.getElementById('guideSettings').onclick=()=>go('settings')}
const navigationIcons={
 home:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M10 9v12"/>',
 products:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/>',
 skills:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8m-8 4h8m-8 4h4"/>',
 settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="var(--nav-surface, white)"/><circle cx="15" cy="17" r="2" fill="var(--nav-surface, white)"/>',
 guide:'<path d="M12 7a4 4 0 0 0-4-4H3v16h5a4 4 0 0 1 4 2 4 4 0 0 1 4-2h5V3h-5a4 4 0 0 0-4 4Zm0 0v14"/>',
 agent:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18m-12 4 2 2-2 2m5 0h3"/>'
};
function renderNavigation(){
 const current=['listing','images'].includes(view)?'products':view;
 $('#nav').innerHTML=Object.entries(names).filter(([key])=>navigationIcons[key]).map(([key,label])=>`<button ${key===current?'class="active" aria-current="page"':''} data-view="${key}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${navigationIcons[key]}</svg>${label}</button>`).join('');
 $('#nav').querySelectorAll('button').forEach(button=>button.onclick=()=>go(button.dataset.view));
 $('#crumb').textContent=names[view];
}
function productIdentity(p){return `${p.sourceImport?.market||p.market||'US'} · ${p.sku||p.id}`;}
function renderSkillsPage(){
 if(typeof window.renderWorkbenchSkills==='function')return window.renderWorkbenchSkills();
 $('#content').innerHTML=title('技能','当前实例未能加载技能页面')+'<p class="notice" role="alert">请重启开发工作台并刷新页面。</p>';
}
function render(){if(view==='reviews')view='products';renderNavigation();({home:()=>window.renderWorkbenchHome?.(),library:()=>window.renderProductLibrary(),products:renderProducts,listing:renderListing,images:renderImages,reviews:renderReviews,settings:()=>{},skills:renderSkillsPage,guide:renderGuide,agent:renderGuide})[view]();const pp=$('#productPicker');if(pp)pp.onchange=()=>{selected=pp.value;render()}}
function renderProducts(){
 const display=p=>productDisplayStatus(p),counts=s=>state.products.filter(p=>display(p)===s).length;
 $('#content').innerHTML=title('产品档案','制作中涵盖文案、作图与 ERP 交接。ERP 受理发布后计为已完成。需要处理的商品包含待补资料或需修改的商品。',`<button class="btn" id="import">批量导入</button><button class="btn primary" id="new">新建产品</button>`)+`
 <div class="stats">
 <div class="stat"><small>产品总数</small><strong>${state.products.length}<span class="sub"> 款</span></strong></div>
 <div class="stat"><small>制作中</small><strong>${counts('制作中')}</strong></div>
 <div class="stat"><small>已完成</small><strong>${counts('已完成')}</strong></div>
 <div class="stat"><small>需要处理</small><strong>${counts('待补资料')+counts('需修改')}</strong></div></div>
 <div class="panel"><div class="toolbar"><div class="tabs">${['全部','服装','日用百货','制作中','已完成'].map(f=>`<button class="tab ${filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><input id="search" type="search" placeholder="搜索产品 ID、名称或父 SKU" value="${esc(query)}" aria-label="搜索产品"></div><div class="tablewrap product-table-wrap"><table class="product-table" role="table"><thead role="rowgroup"><tr role="row"><th scope="col">父 SKU</th><th scope="col">产品</th><th scope="col">变体</th><th scope="col">站点</th><th scope="col">负责人</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead><tbody id="rows" role="rowgroup"></tbody></table></div><div class="footerline"><span id="count"></span></div></div>`;
 drawRows();$('#search').oninput=e=>{query=e.target.value;drawRows()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$('#new').onclick=newProduct;$('#import').onclick=importDialog;
 void refreshProductPublicationStatus();
}
function drawRows(){const display=p=>typeof productDisplayStatus==='function'?productDisplayStatus(p):p.status;const ps=state.products.filter(p=>(filter==='全部'||p.cat===filter||display(p)===filter)&&([p.name,p.id,p.sku].filter(Boolean).join(" ")).toLowerCase().includes(query.toLowerCase()));$('#rows').innerHTML=ps.map(p=>`<tr role="row" class="product-table-row"><td role="cell" class="product-table-sku"><code class="product-id" title="来源记录 ID：${esc(p.id)}">${esc(p.sku||p.id)}</code></td><td role="cell" class="product-table-name"><div class="product"><div class="thumb">${art(p)}</div><div><strong>${esc(p.name)}</strong><span class="sub product-identity">${esc(productIdentity(p))}</span><span class="sub product-category">${esc(p.cat)}</span></div></div></td><td role="cell" class="product-table-variants">${p.colors} 色 × ${p.sizes} 码<br><span class="sub">${p.colors*p.sizes} 个 SKU</span></td><td role="cell" class="product-table-market"><span class="badge">${esc(p.sourceImport?.market||p.market||"US")}</span></td><td role="cell" class="product-table-owner">${esc(p.owner)}</td><td role="cell" class="product-table-status"><span class="pill ${display(p)==='已完成'?'complete':display(p)==='需修改'?'red':display(p)==='制作中'?'blue':''}">${esc(display(p))}</span></td><td role="cell" class="product-table-actions"><button class="link" data-edit="${esc(p.id)}">编辑产品 →</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">没有符合条件的产品</td></tr>';$('#count').textContent=`共 ${ps.length} 款`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openProduct(b.dataset.edit,'listing'))}
function defaults(p){return {highlights:'',title:'',bullets:'',description:'',terms:'',zh:''}}
function titleFieldLimits(){return ['US','UK'].includes(market)?{title:75,highlights:125}:{title:75}}
function copyFieldCount(k,value){const limit=titleFieldLimits()[k],n=Array.from(value).length;return k==='title'?`${n} 字符 · 要求 60–75 字符（含空格）${n<60?' · 还需 '+(60-n)+' 字符':n>75?' · 超出 '+(n-75)+' 字符':''}`:limit?`${n} / ${limit} 字符（含空格）${n>limit?' · 超出 '+(n-limit)+' 字符':''}`:`${new TextEncoder().encode(value).length} 字节 / ${n} 字符`}
function checkTitleFields(c){for(const [key,limit]of Object.entries(titleFieldLimits())){if(!String(c[key]||'').trim()){toast('请填写'+({title:'主标题',highlights:'商品亮点'})[key]);return false}const n=Array.from(c[key]).length;if(key==='title'&&(n<60||n>75)){toast('主标题须为 60–75 字符（含空格），当前 '+n+' 字符，请修改后再导出或提交');return false}if(n>limit){toast(({title:'主标题',highlights:'商品亮点'})[key]+'超过 '+limit+' 字符，请修改后再导出或提交');return false}}return true}
function renderListing(){const p=product(),productMarket=p.sourceImport?.market||p.market||'US';market=productMarket;const key=p.id+'-'+market,c=state.copy[key]||defaults(p);$('#content').innerHTML=title('Listing 编辑','按产品资料生成草稿，自动跟随当前产品站点。',`<button class="btn" id="export">导出当前站点</button><button class="btn primary" id="submit">保存并提交审核</button>`)+`<div class="notice">先核对产品事实，再生成文案。生成结果是待审核草稿；竞品研究和内容提示在下方，可折叠查看。</div><div class="grid"><div class="panel box"><h2>产品事实卡</h2>${picker()}<div style="display:flex;justify-content:center;margin:18px">${art(p)}</div><div class="fact"><span>父 SKU</span>${esc(p.id)}</div><div class="fact"><span>颜色 / 尺码</span>${p.colors} 色 · ${p.sizes} 码</div><div class="fact"><span>来源素材</span>供应商图片＋实拍图（示例）</div><div class="fact"><span>待确认</span>材质成分、尺寸数据、包装内容</div><button class="link" id="toimages" style="margin-top:15px">前往图片工作台 →</button></div><div class="panel"><div class="toolbar"><div class="tabs"><span class="sub">文案站点：${esc(market)} · 跟随产品站点</span></div><span class="saved" id="saveStatus">可编辑 · 自动保存</span></div><div class="box">${[['title','主标题 · Item name',85],['highlights','商品亮点 · Item highlights',85],['bullets','五点描述',185],['description','产品描述',100],['terms','后台搜索词',70],['zh','中文对照',70]].map(([k,n,h])=>`<label class="field"><span>${n}<small id="len-${k}" style="${(titleFieldLimits()[k]&&Array.from(c[k]||'').length>titleFieldLimits()[k])?'color:#b42318':''}">${copyFieldCount(k,c[k]||'')}</small></span><textarea data-field="${k}" style="min-height:${h}px">${esc(c[k]||'')}</textarea></label>`).join('')}<div class="sub">${['US','UK'].includes(market)?'草稿计数参考：主标题 ≤75 字符、商品亮点 ≤125 字符（含空格）。这是软件检查值，刊登前核对当前类目要求。':'草稿计数参考：标题 ≤200 字符，非已核实的类目限制；商品亮点为可选字段，刊登前核对站点字段支持。'}</div></div></div></div>`;document.querySelectorAll('[data-field]').forEach(t=>t.oninput=()=>{state.copy[key]||={...c};state.copy[key][t.dataset.field]=t.value;persist();$('#len-'+t.dataset.field).textContent=copyFieldCount(t.dataset.field,t.value);$('#len-'+t.dataset.field).style.color=(titleFieldLimits()[t.dataset.field]&&Array.from(t.value).length>titleFieldLimits()[t.dataset.field])?'#b42318':'';$('#saveStatus').textContent='修改待同步到服务器'});document.querySelectorAll('[data-market]').forEach(b=>b.onclick=()=>{market=b.dataset.market;render()});$('#toimages').onclick=()=>go('images');$('#export').onclick=exportCopy;$('#submit').onclick=()=>{if(!checkTitleFields(state.copy[key]||c))return;state.copy[key]||={...c};p.status='待审核';state.reviews[p.id]={copy:false,images:false,note:''};persist();toast('已保存，文案与图片进入待审核');go('reviews')}}
function renderImages(){const p=product();$('#content').innerHTML=title('图片工作台','按图片用途规划内容，颜色变体绑定各自真实素材。',picker())+`<div class="notice">以下为矢量占位示意图，不是 AI 生成产品图。可体验图片方案编辑；实际上传、生成、局部重绘将在接入图片服务后启用。</div><div class="gallery">${['白底主图','生活场景图','核心卖点图','尺寸说明图','材质细节图','配件与包装图','颜色展示图'].map((n,i)=>`<div class="imagecard"><div class="art ${i===1?'scene':i===4?'detail':''}">${art(p)}<span class="artlabel">${String(i+1).padStart(2,'0')} / ${n} · 示意</span></div><div class="cardbody"><h2>${n}</h2><p>${esc(state.copy[p.id+'-image-'+i]||['真实产品抠图，保留外观与颜色','产品主体与使用环境相结合','确认卖点后使用可编辑文字排版','仅使用确认过的尺寸数据','保持面料纹理或产品材质细节','核对配件种类与实际数量','每个颜色使用独立参考素材'][i])}</p><button class="btn" data-plan="${i}">编辑图片方案</button></div></div>`).join('')}</div>`;document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{imageIndex=Number(b.dataset.plan);const k=p.id+'-image-'+imageIndex;$('#modal').innerHTML=`<h2>编辑第 ${imageIndex+1} 张图片方案</h2><p style="margin-top:10px">记录构图、参考素材和文字要求。</p><textarea id="plan" style="width:100%;height:140px;margin:20px 0" placeholder="例如：使用米白色实拍图，搭配浅色背景，保留衣服印花。">${esc(state.copy[k]||'')}</textarea><div class="actions"><button class="btn" id="close">取消</button><button class="btn primary" id="saveplan">保存方案</button></div>`;$('#modal').showModal();$('#close').onclick=()=>$('#modal').close();$('#saveplan').onclick=()=>{state.copy[k]=$('#plan').value;persist();$('#modal').close();render();toast('图片方案已保存')}})}
function renderReviews(){const ps=state.products.filter(p=>['待审核','需修改','已通过'].includes(p.status));$('#content').innerHTML=title('审核中心','分别确认文案与图片，通过后锁定为可导出状态。')+`<div class="notice">原型审核用于体验流程，不代表实际内容已符合亚马逊规则。正式版将在此展示原图对照、两站文案和每次修改记录。</div><div class="panel">${ps.map(p=>{const r=state.reviews[p.id]||{copy:false,images:false};return `<div class="reviewitem"><div class="product"><div class="thumb">${art(p)}</div><div><strong>${esc(p.name)}</strong><span class="sub">${esc(p.id)} · ${p.status}</span>${r.note?`<p style="font-size:12px">修改意见：${esc(r.note)}</p>`:''}</div></div><div class="actions"><button class="btn" data-copy="${esc(p.id)}">${r.copy?'✓ 文案已确认':'确认文案'}</button><button class="btn" data-image="${esc(p.id)}">${r.images?'✓ 图片已确认':'确认图片'}</button><button class="btn" data-reject="${esc(p.id)}">退回</button><button class="btn primary" data-pass="${esc(p.id)}" ${!r.copy||!r.images?'disabled':''}>通过</button></div></div>`}).join('')||'<div class="empty">暂无待审核内容</div>'}</div>`;for(const [attr,key]of [['copy','copy'],['image','images']])document.querySelectorAll('[data-'+attr+']').forEach(b=>b.onclick=()=>{const id=b.dataset[attr];state.reviews[id]||={copy:false,images:false,note:''};state.reviews[id][key]=!state.reviews[id][key];persist();render()});document.querySelectorAll('[data-pass]').forEach(b=>b.onclick=()=>{state.products.find(p=>p.id===b.dataset.pass).status='已通过';persist();render();toast('审核通过，最终版本可导出')});document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{const id=b.dataset.reject;$('#modal').innerHTML='<h2>退回修改</h2><textarea id="reason" style="width:100%;height:120px;margin:20px 0" placeholder="请填写具体修改意见"></textarea><div class="actions"><button class="btn" id="cancel">取消</button><button class="btn primary" id="confirmReject">确认退回</button></div>';$('#modal').showModal();$('#cancel').onclick=()=>$('#modal').close();$('#confirmReject').onclick=()=>{const note=$('#reason').value.trim();if(!note)return toast('请填写修改意见');state.products.find(p=>p.id===id).status='需修改';state.reviews[id]={copy:false,images:false,note};persist();$('#modal').close();render();toast('已退回并保存修改意见')}})}
function newProduct(){
const owner=typeof signedUser!=='undefined'&&signedUser? signedUser.name||signedUser.username:'当前账号';
$('#modal').innerHTML='<h2>新建父产品</h2><form id="newform"><label>产品名称<input name="name" required maxlength="100" placeholder="例如：女士圆领短袖"></label><label>父 SKU<input name="sku" required maxlength="60" pattern="[A-Za-z0-9_-]+" placeholder="例如：AP-1026-006"></label><label>品类<select name="cat"><option>服装</option><option>日用百货</option></select></label><label>负责人<input name="owner" readonly value="'+esc(owner)+'"></label><div class="actions"><button type="button" class="btn" id="cancelnew">取消</button><button class="btn primary">创建产品</button></div></form>';
$('#modal').showModal();$('#cancelnew').onclick=()=>$('#modal').close();
$('#newform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),id=f.get('sku').trim(),name=f.get('name').trim();if(!name)return toast('请填写产品名称');if(state.products.some(p=>p.id===id))return toast('父 SKU 已存在');state.products.unshift({id,name,cat:f.get('cat'),owner,colors:1,sizes:1,status:'待补资料',color:'#9eae94'});selected=id;persist();$('#modal').close();filter='全部';query='';render();toast('产品档案已创建')}
}
function download(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCopy(){const p=product(),c=state.copy[p.id+'-'+market]||defaults(p);if(!checkTitleFields(c))return;download(p.id+'-'+market+'-listing.txt',`Listing 文案草稿 / 需人工审核\n父 SKU：${p.id}\n产品：${p.name}\n站点：${market}\n\n`+Object.entries(c).map(([k,v])=>`${({title:'主标题 / Item name',highlights:'商品亮点 / Item highlights'})[k]||k}\n${typeof v==='object'?JSON.stringify(v,null,2):v}`).join('\n\n'),'text/plain;charset=utf-8');toast('已导出当前站点文案草稿')}
function importDialog(){$('#modal').innerHTML='<h2>批量导入</h2><p style="margin:15px 0">正式版将支持 Excel 与图片文件夹映射。原型提供字段模板，便于团队先整理资料。</p><div class="notice">父 SKU、产品名称、品类、负责人、颜色、尺码、材质、尺寸、包装内容、关键词、素材路径。</div><div class="actions"><button class="btn" id="closeimport">关闭</button><button class="btn primary" id="template">下载 CSV 字段模板</button></div>';$('#modal').showModal();$('#closeimport').onclick=()=>$('#modal').close();$('#template').onclick=()=>download('产品资料导入模板.csv','\uFEFF父SKU,产品名称,品类,负责人,颜色,尺码,材质,尺寸,包装内容,关键词,素材路径\r\nAP-EXAMPLE-001,示例产品,服装,小林,米白色,M,待确认,待确认,待确认,待填写,AP-EXAMPLE-001/米白色/\r\n','text/csv;charset=utf-8')}
render();
